[project]
name = "fastapi-aiops-agents"
version = "0.1.0"
description = ""
authors = [
    {name = "lsugarj"}
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi (>=0.135.3,<0.136.0)",
    "litellm (>=1.83.4,<2.0.0)",
    "uvicorn (>=0.44.0,<0.45.0)",
    "greenlet (>=3.3.2,<4.0.0)",
    "prometheus-client (>=0.24.1,<0.25.0)",
    "opentelemetry-api (>=1.37.0,<2.0.0)",
    "opentelemetry-sdk (>=1.37.0,<2.0.0)",
    "opentelemetry-exporter-otlp-proto-grpc (>=1.37.0,<2.0.0)",
    "opentelemetry-instrumentation-fastapi (>=0.58b0,<0.59)",
    "kubernetes (>=35.0.0,<36.0.0)",
    "pytest (>=9.0.3,<10.0.0)"
]

[tool.poetry]
packages = [
    { include = "app", from = "." }
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
